# One website project per language; the sidebars of en and de must stay
# parallel — gen_langmap.py derives the switcher's page map from them.
project:
  type: website
  output-dir: ../../site/en
  resources:
    - font/

lang: en

website:
  title: easyQDA Theme
  site-url: https://theme.zotqda.org/latest/en/
  repo-url: https://github.com/easyqda/easyQDA-quarto-theme
  navbar:
    search: true
    pinned: true
    right:
      # Language menu behind the translate icon; langmap.js retargets
      # the entries to the translation of the current page.
      # The whole documentation as one linked PDF, built by
      # print/make_pdf.py during the site build.
      - icon: file-pdf
        aria-label: PDF
        href: easyqda-theme-documentation.pdf
      - icon: translate
        aria-label: Language
        menu:
          - text: English
            href: ../en/index.html
          - text: Deutsch
            href: ../de/index.html
      # The theme moves this item over the right sidebar.
      - icon: github
        text: GitHub
        href: https://github.com/easyqda/easyQDA-quarto-theme
  sidebar:
    style: docked
    collapse-level: 3
    contents:
      - text: Start
        href: index.qmd
      - section: Using the theme
        contents:
          - text: Getting started
            href: guide/getting-started.qmd
          - text: The look
            href: guide/look.qmd
          - text: Working offline
            href: guide/offline.qmd
          - text: Multilingual sites
            href: guide/multilingual.qmd
          - text: The docs as one PDF
            href: guide/pdf.qmd
          - text: Versioned sites
            href: guide/versions.qmd
          - text: Customising
            href: guide/customising.qmd
      - section: For developers
        contents:
          - text: Repository layout
            href: dev/layout.qmd
          - text: Maintenance and the Quarto pin
            href: dev/maintenance.qmd
      - text: Licence
        href: licence.qmd
      - text: Impressum
        href: impressum.qmd
      - text: Privacy
        href: privacy.qmd
  page-footer:
    center: >-
      © fre.ms — MIT licence —
      [Impressum](https://theme.zotqda.org/latest/en/impressum.html) ·
      [Privacy](https://theme.zotqda.org/latest/en/privacy.html)

format:
  easyqda-theme-html:
    css: font/noto.css
    include-after-body: theme/scripts.html
